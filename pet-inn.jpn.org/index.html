    "河口湖": "山梨県", "忍野": "山梨県", "富士吉田": "山梨県", "北杜": "山梨県",
    "軽井沢": "長野県", "佐久": "長野県",
    "伊豆高原": "静岡県", "西伊豆": "静岡県", "伊豆": "静岡県",
  };
  // Prefecture display order (都道府県コード順)
  const prefOrder = ["茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "神奈川県", "山梨県", "長野県", "静岡県"];
  const prefOf = d => regionToPref[d.region] || d.region;

  // Build prefecture counts
  const prefCounts = new Map();
  sorted.forEach(d => {
    const p = prefOf(d);
    prefCounts.set(p, (prefCounts.get(p) || 0) + 1);
  });
  const prefectures = [...prefCounts.keys()].sort((a, b) => {
    const ia = prefOrder.indexOf(a);
    const ib = prefOrder.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });
  if (statTotal) statTotal.textContent = sorted.length;
  if (statRegions) statRegions.textContent = prefectures.length;

  // Build filter chips
  const chipAll = document.createElement("button");
  chipAll.type = "button";
  chipAll.className = "filter-chip";
  chipAll.setAttribute("aria-pressed", "true");
  chipAll.dataset.region = "__all__";
  chipAll.innerHTML = `すべて<span class="count">${sorted.length}</span>`;
  filters.appendChild(chipAll);

  prefectures.forEach(p => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "filter-chip";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.region = p;
    chip.innerHTML = `${p}<span class="count">${prefCounts.get(p)}</span>`;
    filters.appendChild(chip);
  });

  // Number formatter
  const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });

  // Card SVG mark
  const pawSVG = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <circle cx="6" cy="9" r="1.6"/><circle cx="10" cy="6" r="1.6"/>
    <circle cx="14" cy="6" r="1.6"/><circle cx="18" cy="9" r="1.6"/>
    <path d="M8 14 Q12 10 16 14 Q19 17 16 19 Q12 21 8 19 Q5 17 8 14 Z"/>
  </svg>`;

  const arrowSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>`;

  // Render cards
  function renderCards(filter) {
    grid.innerHTML = "";
    const list = filter === "__all__" ? sorted : sorted.filter(d => prefOf(d) === filter);

    if (list.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "該当する宿がまだ登録されていません。";
      grid.appendChild(empty);
      return;
    }

    list.forEach(d => {
      const theme = regionThemes[d.region] || ["#a89680", "#5c4d3d"];
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.region = d.region;

      const ratingClass = d.rating === "最良" ? "rating-best"
        : d.rating === "良" ? "rating-good"
        : d.rating === "並" ? "rating-mid" : "";
      const ratingLabel = d.rating === "最良" ? "★ 編集部イチオシ"
        : d.rating === "良" ? "◎ おすすめ"
        : d.rating === "並" ? "○ 掲載" : "";

      const priceRow = d.price
        ? `<div class="card-meta-row"><span class="card-meta-label">1泊料金</span><span class="card-meta-val">${yen.format(d.price)}<span style="font-size:11px;color:var(--ink-mute);margin-left:2px;">〜</span></span></div>`
        : `<div class="card-meta-row"><span class="card-meta-label">1泊料金</span><span class="card-meta-val small">お問い合わせ</span></div>`;

      const noteBlock = d.note ? `<p class="card-note">${d.note}</p>` : "";

      const linkBlock = d.url
        ? `<a class="card-link" href="${d.url}" target="_blank" rel="noopener noreferrer" aria-label="${d.name}の公式サイトを開く">公式サイトを見る${arrowSVG}</a>`
        : `<span class="card-link" aria-disabled="true">公式情報を要確認${arrowSVG}</span>`;

      const imgTag = d.image
        ? `<img class="card-visual-img" src="${d.image}" alt="" loading="lazy" decoding="async" width="600" height="375" referrerpolicy="no-referrer" />`
        : "";

      card.innerHTML = `
        <div class="card-visual" style="background: linear-gradient(135deg, ${theme[0]}, ${theme[1]});">
          ${imgTag}
          <span class="card-region">${d.region}</span>
          ${ratingLabel ? `<span class="card-rating ${ratingClass}">${ratingLabel}</span>` : ""}
          ${d.image ? "" : `<span class="card-visual-mark" aria-hidden="true">${pawSVG}</span>`}
        </div>
        <div class="card-body">
          <h3 class="card-title">${d.name}</h3>
          <div class="card-meta">
            <div class="card-meta-row"><span class="card-meta-label">エリア</span><span class="card-meta-val small">${d.region}</span></div>
            ${priceRow}
          </div>
          ${noteBlock}
          ${linkBlock}
        </div>
      `;

      const img = card.querySelector(".card-visual-img");
      if (img) {
        if (img.complete && img.naturalWidth > 0) {
          img.classList.add("is-loaded");
        } else {
          img.addEventListener("load", () => {
            if (img.naturalWidth > 0) img.classList.add("is-loaded");
          }, { once: true });
          img.addEventListener("error", () => { img.remove(); }, { once: true });
        }
      }

      grid.appendChild(card);
    });
  }

  // Filter handling
  filters.addEventListener("click", e => {
    const chip = e.target.closest(".filter-chip");
    if (!chip) return;
    [...filters.children].forEach(c => c.setAttribute("aria-pressed", "false"));
    chip.setAttribute("aria-pressed", "true");
    const region = chip.dataset.region;
    if (region === "__all__") {
      history.replaceState(null, "", "#selection");
    } else {
      history.replaceState(null, "", `#area=${encodeURIComponent(region)}`);
    }
    renderCards(region);
  });

  // Initial render — deep link support
  const hash = decodeURIComponent(location.hash || "");
  let initial = "__all__";
  const m = hash.match(/^#area=(.+)$/);
  if (m && prefectures.includes(m[1])) {
    initial = m[1];
    [...filters.children].forEach(c => {
      c.setAttribute("aria-pressed", c.dataset.region === initial ? "true" : "false");
    });
  }
  renderCards(initial);

})();
</script>
</body>
</html>
